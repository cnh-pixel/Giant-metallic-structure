<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金屬晶體模型：延性與展性</title>
  <style>
    :root {
      --copper: #c9854a;
      --gold: #e6c35c;
      --panel: rgba(18, 12, 8, 0.82);
      --line: rgba(232, 196, 120, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #120c08;
      font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
      color: #f3e6d0;
    }
    #view { width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute;
      inset: 16px auto auto 16px;
      width: min(420px, calc(100vw - 32px));
      padding: 16px 18px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      pointer-events: none;
      z-index: 2;
    }
    #hud h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--gold);
    }
    #hud p {
      margin: 0 0 10px;
      font-size: 13.5px;
      line-height: 1.55;
      color: #ead9c0;
    }
    .hint {
      font-size: 12.5px !important;
      color: #cbb89a !important;
    }
    .stats {
      display: flex;
      gap: 10px;
      margin: 8px 0 10px;
      pointer-events: none;
    }
    .stat {
      flex: 1;
      background: rgba(255, 210, 140, 0.08);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .stat b {
      display: block;
      font-size: 11px;
      color: #c9b08a;
      font-weight: 600;
    }
    .stat span {
      font-size: 20px;
      color: #fff6e6;
      font-variant-numeric: tabular-nums;
    }
    #reset {
      pointer-events: auto;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #1a1008;
      background: linear-gradient(180deg, #f0d089, #c9854a);
      cursor: pointer;
    }
    #reset:hover { filter: brightness(1.08); }
    #reset:active { transform: translateY(1px); }
    #legend {
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #e6d3b6;
      z-index: 2;
    }
    #legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .dot-cu { background: #b87333; }
    .dot-au { background: #d4af37; }
    .dot-mk { background: #f5edd0; box-shadow: 0 0 6px #f5edd0; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>金屬晶體模型：延性與展性</h1>
    <p>金屬是<strong>固態晶體</strong>。原子平時鎖在晶格原位，整塊穩穩放在砧上，不會像水流動。敲打時只有擊中點附近的原子局部移動，留下塑性凹痕；遠處原子完全不動。這就是延性與展性——金屬可被敲薄、拉長，卻仍然是固體。</p>
    <p class="hint">拖曳空白處旋轉視角；點擊金屬敲打一下。鎚面碰到的瞬間才開始凹陷。</p>
    <div class="stats">
      <div class="stat"><b>敲打次數</b><span id="hitCount">0</span></div>
      <div class="stat"><b>原子數量</b><span id="atomCount">0</span></div>
    </div>
    <button id="reset" type="button">重置晶體</button>
  </div>
  <div id="legend">
    <div><i class="dot-cu"></i>銅色層　<i class="dot-au"></i>金色層</div>
    <div><i class="dot-mk"></i>淺色標記原子（觀察是否移動）</div>
  </div>
  <canvas id="view"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const N = 8;
    const SPACING = 1.28;
    const ATOM_R = 0.56;
    const COLLIDE_R = 0.46;
    const IMPACT_RADIUS = 2.55 * SPACING;
    const IMPACT_DEPTH = 3.15 * SPACING;
    const DENT_PER_HIT = 0.82 * SPACING;
    const MAX_PLASTIC = 2.15 * SPACING;
    const SPRING_K = 155;
    const DAMPING = 21;
    const FACE_OFFSET = 1.28;

    const LAYER_COLORS = [
      0x6e3b22, 0x8d4e28, 0xb87333, 0xd0893c,
      0xc9a227, 0xd4af37, 0xe6c35c, 0xb8860b
    ];
    const MARKER_COLOR = 0xf3ebd0;

    const canvas = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a120c);
    scene.fog = new THREE.Fog(0x1a120c, 22, 48);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);
    camera.position.set(11.5, 9.8, 14.5);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 32;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 3.6, 0);
    controls.update();

    scene.add(new THREE.HemisphereLight(0xffe6c8, 0x3a2418, 0.55));
    const key = new THREE.DirectionalLight(0xfff3dd, 1.55);
    key.position.set(8, 16, 10);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 2;
    key.shadow.camera.far = 40;
    key.shadow.camera.left = -14;
    key.shadow.camera.right = 14;
    key.shadow.camera.top = 14;
    key.shadow.camera.bottom = -14;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x8899bb, 0.35);
    fill.position.set(-10, 6, -8);
    scene.add(fill);
    const sparkLight = new THREE.PointLight(0xffe8a0, 0, 8);
    scene.add(sparkLight);

    const woodTex = makeWoodTexture();
    const woodMat = new THREE.MeshStandardMaterial({
      map: woodTex, roughness: 0.82, metalness: 0.04, color: 0xc4a07a
    });
    const ironMat = new THREE.MeshStandardMaterial({
      color: 0x3a3d44, roughness: 0.42, metalness: 0.85
    });

    const floor = new THREE.Mesh(new THREE.CircleGeometry(22, 48), new THREE.MeshStandardMaterial({
      color: 0x2a211c, roughness: 0.95, metalness: 0
    }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.35;
    floor.receiveShadow = true;
    scene.add(floor);

    const table = new THREE.Mesh(new THREE.BoxGeometry(18, 0.55, 12), woodMat);
    table.position.y = -0.90;
    table.castShadow = true;
    table.receiveShadow = true;
    scene.add(table);
    const legGeo = new THREE.BoxGeometry(0.55, 1.2, 0.55);
    for (const [x, z] of [[-7.4, -4.6], [7.4, -4.6], [-7.4, 4.6], [7.4, 4.6]]) {
      const leg = new THREE.Mesh(legGeo, woodMat);
      leg.position.set(x, -1.75, z);
      leg.castShadow = true;
      scene.add(leg);
    }

    const anvil = new THREE.Mesh(new THREE.BoxGeometry(11.2, 0.85, 11.2), ironMat);
    anvil.position.y = -0.35;
    anvil.castShadow = true;
    anvil.receiveShadow = true;
    scene.add(anvil);
    const anvilHorn = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.45, 11.6), ironMat);
    anvilHorn.position.set(0, 0.02, 0);
    anvilHorn.receiveShadow = true;
    scene.add(anvilHorn);

    const cubeExtent = (N - 1) * SPACING;
    const y0 = ATOM_R + 0.08;
    const restMin = new THREE.Vector3(-cubeExtent / 2, y0, -cubeExtent / 2);
    const restMax = new THREE.Vector3(cubeExtent / 2, y0 + cubeExtent, cubeExtent / 2);

    const pickBox = new THREE.Mesh(
      new THREE.BoxGeometry(
        cubeExtent + ATOM_R * 2.15,
        cubeExtent + ATOM_R * 2.15,
        cubeExtent + ATOM_R * 2.15
      ),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    pickBox.position.set(0, y0 + cubeExtent / 2, 0);
    scene.add(pickBox);

    const atoms = [];
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    const mid = (N - 1) / 2;

    for (let iy = 0; iy < N; iy++) {
      for (let iz = 0; iz < N; iz++) {
        for (let ix = 0; ix < N; ix++) {
          const rest = new THREE.Vector3(
            (ix - mid) * SPACING,
            y0 + iy * SPACING,
            (iz - mid) * SPACING
          );
          const isMarker =
            (Math.abs(ix - mid) <= 0.6 && Math.abs(iy - mid) <= 0.6 && Math.abs(iz - mid) <= 0.6) ||
            (Math.abs(ix - mid) <= 0.6 && Math.abs(iy - mid) <= 0.6 && iz === N - 1);
          atoms.push({
            idx: atoms.length,
            rest: rest.clone(),
            home: rest.clone(),
            pos: rest.clone(),
            vel: new THREE.Vector3(),
            locked: true,
            layer: iy,
            marker: isMarker,
            color: isMarker ? MARKER_COLOR : LAYER_COLORS[iy]
          });
        }
      }
    }

    const atomMat = new THREE.MeshStandardMaterial({
      metalness: 0.92,
      roughness: 0.28,
      envMapIntensity: 1.15
    });
    const atomMesh = new THREE.InstancedMesh(
      new THREE.SphereGeometry(ATOM_R, 20, 16),
      atomMat,
      atoms.length
    );
    atomMesh.castShadow = true;
    atomMesh.receiveShadow = true;
    atomMesh.frustumCulled = false;
    atomMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(atomMesh);

    for (let i = 0; i < atoms.length; i++) {
      dummy.position.copy(atoms[i].pos);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      atomMesh.setMatrixAt(i, dummy.matrix);
      atomMesh.setColorAt(i, color.setHex(atoms[i].color));
    }
    atomMesh.instanceMatrix.needsUpdate = true;
    atomMesh.instanceColor.needsUpdate = true;

    document.getElementById('atomCount').textContent = String(atoms.length);

    const hammer = buildHammer();
    scene.add(hammer);
    const idlePos = new THREE.Vector3(8.4, 3.35, 4.2);
    const idleQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.18, 0.55, 0.15));
    hammer.position.copy(idlePos);
    hammer.quaternion.copy(idleQuat);

    const impactRing = new THREE.Mesh(
      new THREE.RingGeometry(0.2, IMPACT_RADIUS, 40),
      new THREE.MeshBasicMaterial({
        color: 0xffd27a, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
      })
    );
    scene.add(impactRing);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const _v = new THREE.Vector3();
    const _v2 = new THREE.Vector3();
    const _v3 = new THREE.Vector3();
    const _q = new THREE.Quaternion();
    const _q2 = new THREE.Quaternion();
    const _m = new THREE.Matrix4();
    const _up = new THREE.Vector3(0, 1, 0);

    let hitCount = 0;
    let sparkT = 0;
    let ringT = 0;
    let dragging = false;
    let downX = 0, downY = 0;
    let busy = false;
    let hammerAnim = null;
    const unlocked = [];

    canvas.addEventListener('pointerdown', (e) => {
      dragging = false;
      downX = e.clientX;
      downY = e.clientY;
    });
    canvas.addEventListener('pointermove', (e) => {
      if (e.buttons && (Math.hypot(e.clientX - downX, e.clientY - downY) > 6)) dragging = true;
      setPointer(e);
      const hit = pickMetal();
      canvas.style.cursor = hit ? 'pointer' : (e.buttons ? 'grabbing' : 'grab');
    });
    canvas.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
      if (dragging || dist > 7) return;
      setPointer(e);
      const hit = pickMetal();
      if (hit && !busy) startStrike(hit);
    });
    document.getElementById('reset').addEventListener('click', resetCrystal);
    window.addEventListener('resize', onResize);

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(tick);

    function tick() {
      const dt = Math.min(clock.getDelta(), 1 / 30);
      controls.update();
      updateHammer(dt);
      simulate(dt);
      if (sparkT > 0) {
        sparkT = Math.max(0, sparkT - dt);
        sparkLight.intensity = 7 * (sparkT / 0.18);
      } else sparkLight.intensity = 0;
      if (ringT > 0) {
        ringT = Math.max(0, ringT - dt);
        impactRing.material.opacity = 0.45 * (ringT / 0.55);
      } else impactRing.material.opacity = 0;
      renderer.render(scene, camera);
    }

    function simulate(dt) {
      if (!unlocked.length) return;
      const sub = 3;
      const h = dt / sub;
      for (let s = 0; s < sub; s++) {
        for (let i = unlocked.length - 1; i >= 0; i--) {
          const a = unlocked[i];
          _v.copy(a.home).sub(a.pos);
          a.vel.addScaledVector(_v, SPRING_K * h);
          a.vel.multiplyScalar(Math.max(0, 1 - DAMPING * h));
          const spd = a.vel.length();
          if (spd > 10) a.vel.multiplyScalar(10 / spd);
          a.pos.addScaledVector(a.vel, h);
          if (a.pos.y < ATOM_R * 0.92) {
            a.pos.y = ATOM_R * 0.92;
            if (a.vel.y < 0) a.vel.y = 0;
          }
        }
        collideUnlocked();
      }
      for (let i = unlocked.length - 1; i >= 0; i--) {
        const a = unlocked[i];
        const still = a.vel.lengthSq() < 0.0025 && a.pos.distanceToSquared(a.home) < 0.004;
        if (still) {
          a.pos.copy(a.home);
          a.vel.set(0, 0, 0);
          a.locked = true;
          writeInstance(a.idx);
          unlocked.splice(i, 1);
        } else {
          writeInstance(a.idx);
        }
      }
      atomMesh.instanceMatrix.needsUpdate = true;
    }

    function collideUnlocked() {
      const minD = COLLIDE_R * 2;
      const minD2 = minD * minD;
      for (const a of unlocked) {
        for (let j = 0; j < atoms.length; j++) {
          const b = atoms[j];
          if (b === a) continue;
          _v.copy(a.pos).sub(b.pos);
          const d2 = _v.lengthSq();
          if (d2 >= minD2 || d2 < 1e-8) continue;
          const d = Math.sqrt(d2);
          const overlap = minD - d;
          _v.multiplyScalar(1 / d);
          if (b.locked) {
            a.pos.addScaledVector(_v, overlap);
            const vn = a.vel.dot(_v);
            if (vn < 0) a.vel.addScaledVector(_v, -vn * 1.05);
          } else if (a.idx < b.idx) {
            a.pos.addScaledVector(_v, overlap * 0.5);
            b.pos.addScaledVector(_v, -overlap * 0.5);
            const rv = a.vel.dot(_v) - b.vel.dot(_v);
            if (rv < 0) {
              a.vel.addScaledVector(_v, -rv * 0.35);
              b.vel.addScaledVector(_v, rv * 0.35);
            }
          }
        }
      }
    }

    function startStrike(hit) {
      const inward = faceInward(hit.point);
      if (inward.y > 0.75) return;
      busy = true;
      const impactQuat = lookAlong(inward);
      const swingAxis = new THREE.Vector3(1, 0, 0);
      const raisedQuat = impactQuat.clone().multiply(_q.setFromAxisAngle(swingAxis, -0.95));
      const liftQuat = impactQuat.clone().multiply(_q2.setFromAxisAngle(swingAxis, -0.42));
      const towardCam = camera.position.clone().sub(hit.point).normalize();
      const side = new THREE.Vector3().crossVectors(inward, _up);
      if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
      side.normalize();
      if (side.dot(towardCam) < 0) side.negate();
      const impactPos = hit.point.clone().addScaledVector(inward, -FACE_OFFSET);
      const raisedPos = hit.point.clone()
        .addScaledVector(inward, -FACE_OFFSET - 2.2)
        .addScaledVector(side, 0.45);
      raisedPos.y += 0.35;
      const liftPos = hit.point.clone()
        .addScaledVector(inward, -FACE_OFFSET - 1.05)
        .addScaledVector(side, 1.85);
      liftPos.y += 0.9;

      hammerAnim = {
        t: 0,
        hit: false,
        hitPoint: hit.point.clone(),
        inward: inward.clone(),
        phases: [
          { dur: 0.28, fromP: hammer.position.clone(), toP: raisedPos, fromQ: hammer.quaternion.clone(), toQ: raisedQuat, ease: easeOutCubic },
          { dur: 0.15, fromP: raisedPos, toP: impactPos, fromQ: raisedQuat, toQ: impactQuat, ease: easeInCubic, impact: true },
          { dur: 0.06, fromP: impactPos, toP: impactPos, fromQ: impactQuat, toQ: impactQuat, ease: (x) => x },
          { dur: 0.34, fromP: impactPos, toP: liftPos, fromQ: impactQuat, toQ: liftQuat, ease: easeOutCubic }
        ],
        phase: 0
      };
    }

    function updateHammer(dt) {
      if (!hammerAnim) return;
      const ph = hammerAnim.phases[hammerAnim.phase];
      if (!ph) {
        hammerAnim = null;
        busy = false;
        return;
      }
      hammerAnim.t += dt;
      const u = Math.min(1, hammerAnim.t / ph.dur);
      const e = ph.ease(u);
      hammer.position.lerpVectors(ph.fromP, ph.toP, e);
      hammer.quaternion.slerpQuaternions(ph.fromQ, ph.toQ, e);
      if (ph.impact && !hammerAnim.hit && u >= 0.92) {
        hammerAnim.hit = true;
        applyDent(hammerAnim.hitPoint, hammerAnim.inward);
      }
      if (u >= 1) {
        hammerAnim.phase++;
        hammerAnim.t = 0;
        if (hammerAnim.phase >= hammerAnim.phases.length) {
          hammerAnim = null;
          busy = false;
        }
      }
    }

    function applyDent(hitPoint, inward) {
      hitCount++;
      document.getElementById('hitCount').textContent = String(hitCount);
      clang();
      sparkLight.position.copy(hitPoint);
      sparkT = 0.18;
      impactRing.position.copy(hitPoint).addScaledVector(inward, 0.02);
      impactRing.quaternion.copy(lookAlong(inward));
      ringT = 0.55;

      const sigmaR = 0.92 * SPACING;
      const sigmaD = 1.28 * SPACING;
      const twoSigR = 2 * sigmaR * sigmaR;
      const twoSigD = 2 * sigmaD * sigmaD;

      for (let i = 0; i < atoms.length; i++) {
        const a = atoms[i];
        _v.copy(a.home).sub(hitPoint);
        const along = _v.dot(inward);
        if (along < -0.45 * SPACING || along > IMPACT_DEPTH) continue;
        _v2.copy(_v).addScaledVector(inward, -along);
        const r = _v2.length();
        if (r > IMPACT_RADIUS) continue;
        const g = Math.exp(-(r * r) / twoSigR) * Math.exp(-(along * along) / twoSigD);
        if (g < 0.055) continue;

        let shift = DENT_PER_HIT * g;
        _v3.copy(a.home).addScaledVector(inward, shift).sub(a.rest);
        const already = _v3.length();
        if (already > MAX_PLASTIC) {
          shift -= (already - MAX_PLASTIC);
          if (shift < 0.01) continue;
        }
        a.home.addScaledVector(inward, shift);
        if (r > 0.04) {
          _v2.normalize();
          a.home.addScaledVector(_v2, shift * 0.11 * (r / IMPACT_RADIUS));
        }
        _v3.copy(a.home).sub(a.rest);
        if (_v3.length() > MAX_PLASTIC) {
          _v3.setLength(MAX_PLASTIC);
          a.home.copy(a.rest).add(_v3);
        }
        a.home.y = Math.max(a.home.y, ATOM_R * 0.92);

        if (a.locked) {
          a.locked = false;
          a.idx = i;
          unlocked.push(a);
        }
        a.idx = i;
        a.vel.addScaledVector(inward, 2.4 * g);
      }
    }

    function resetCrystal() {
      hammerAnim = null;
      busy = false;
      unlocked.length = 0;
      hitCount = 0;
      document.getElementById('hitCount').textContent = '0';
      sparkT = 0;
      ringT = 0;
      hammer.position.copy(idlePos);
      hammer.quaternion.copy(idleQuat);
      for (let i = 0; i < atoms.length; i++) {
        const a = atoms[i];
        a.home.copy(a.rest);
        a.pos.copy(a.rest);
        a.vel.set(0, 0, 0);
        a.locked = true;
        a.idx = i;
        writeInstance(i);
      }
      atomMesh.instanceMatrix.needsUpdate = true;
    }

    function pickMetal() {
      raycaster.setFromCamera(pointer, camera);
      const boxHits = raycaster.intersectObject(pickBox, false);
      const atomHits = raycaster.intersectObject(atomMesh, false);
      if (atomHits.length && (!boxHits.length || atomHits[0].distance <= boxHits[0].distance + 0.2)) {
        return { point: atomHits[0].point, id: atomHits[0].instanceId };
      }
      if (boxHits.length) return { point: boxHits[0].point, id: -1 };
      const ndcBest = { i: -1, d: 0.06 };
      for (let i = 0; i < atoms.length; i++) {
        _v.copy(atoms[i].pos).project(camera);
        if (_v.z < -1 || _v.z > 1) continue;
        const d = ( _v.x - pointer.x ) ** 2 + ( _v.y - pointer.y ) ** 2;
        if (d < ndcBest.d) { ndcBest.d = d; ndcBest.i = i; }
      }
      if (ndcBest.i < 0) return null;
      return { point: atoms[ndcBest.i].pos.clone(), id: ndcBest.i };
    }

    function faceInward(p) {
      const cx = 0;
      const cy = y0 + cubeExtent / 2;
      const cz = 0;
      const hx = cubeExtent / 2 + ATOM_R;
      const hy = cubeExtent / 2 + ATOM_R;
      const hz = cubeExtent / 2 + ATOM_R;
      const nx = (p.x - cx) / hx;
      const ny = (p.y - cy) / hy;
      const nz = (p.z - cz) / hz;
      const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
      if (ax >= ay && ax >= az) return new THREE.Vector3(nx > 0 ? -1 : 1, 0, 0);
      if (ay >= az) return new THREE.Vector3(0, ny > 0 ? -1 : 1, 0);
      return new THREE.Vector3(0, 0, nz > 0 ? -1 : 1);
    }

    function lookAlong(dir) {
      const z = dir.clone().normalize();
      const x = new THREE.Vector3().crossVectors(_up, z);
      if (x.lengthSq() < 1e-6) x.set(1, 0, 0).cross(z);
      x.normalize();
      const y = new THREE.Vector3().crossVectors(z, x).normalize();
      _m.makeBasis(x, y, z);
      return new THREE.Quaternion().setFromRotationMatrix(_m);
    }

    function writeInstance(i) {
      dummy.position.copy(atoms[i].pos);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      atomMesh.setMatrixAt(i, dummy.matrix);
    }

    function setPointer(e) {
      const r = canvas.getBoundingClientRect();
      pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    function easeInCubic(t) { return t * t * t; }
    function easeOutCubic(t) { return 1 - (1 - t) ** 3; }

    function buildHammer() {
      const g = new THREE.Group();
      const steel = new THREE.MeshStandardMaterial({
        color: 0xc5cdd6, metalness: 0.88, roughness: 0.28, envMapIntensity: 1.1, emissive: 0x1a1c20
      });
      const handleWood = new THREE.MeshStandardMaterial({
        map: woodTex, color: 0xb57a45, roughness: 0.78, metalness: 0.04
      });
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.48, 1.35), steel);
      head.castShadow = true;
      g.add(head);
      const face = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.12, 20), steel);
      face.rotation.x = Math.PI / 2;
      face.position.z = 0.72;
      face.castShadow = true;
      g.add(face);
      const peen = new THREE.Mesh(new THREE.SphereGeometry(0.20, 14, 12), steel);
      peen.position.z = -0.72;
      peen.scale.set(1, 1, 1.15);
      peen.castShadow = true;
      g.add(peen);
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.35, 10), steel);
      neck.position.y = -0.38;
      g.add(neck);
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.125, 2.55, 12), handleWood);
      handle.position.y = -1.68;
      handle.castShadow = true;
      g.add(handle);
      const pommel = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), handleWood);
      pommel.position.y = -2.95;
      g.add(pommel);
      g.scale.setScalar(1.75);
      g.traverse((o) => { o.frustumCulled = false; });
      return g;
    }

    function makeWoodTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8a5a32';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 48; i++) {
        ctx.strokeStyle = `rgba(40, 18, 8, ${0.12 + Math.random() * 0.25})`;
        ctx.lineWidth = 1.5 + Math.random() * 4;
        const x = Math.random() * 256;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.bezierCurveTo(x + 12, 90, x - 14, 170, x + 6, 256);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    let audioCtx = null;
    function clang() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(480, t0);
        osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.16);
        gain.gain.setValueAtTime(0.12, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.2);
      } catch (_) { /* ignore */ }
    }
  </script>
